name: PR

on:
  pull_request:
    branches: '**'

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # The utils submodule holds its own lint config and package tree. Checking it out here
      # keeps CI's lint and dead-code results identical to a developer's, who has it cloned locally.
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # vp (Vite+) needs Node >= 22.18; the runner's default Node is older
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
      - run: bun run lint
      - run: bun run tsc:e2e

  test:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: read
    # Real OpenSearch for the discovery index integration tests (analyzers, synonyms, ranking can't be faked).
    # Same major version as production; security off because it is only reachable from this job.
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # vp (Vite+) needs Node >= 22.18; the runner's default Node is older
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
      # `bun run tsc --noEmit` type-checks nothing: the root tsconfig holds only project
      # references. This gate runs a real check and fails on any type error the baseline
      # does not already contain.
      - run: bun run typecheck
      - run: bun run --filter @tandra/api test --coverage --coverage-reporter=text --coverage-reporter=lcov
        env:
          OPENSEARCH_TEST_URL: http://localhost:9200
      - name: Check coverage threshold (90% lines and functions)
        run: bun scripts/check-coverage.js packages/api/coverage/lcov.info 90

  # Web unit tests (Vitest, happy-dom) and the script tests need no services, so they run
  # here in parallel with `test` instead of waiting ~45s for its OpenSearch container.
  test-web:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # vp (Vite+) needs Node >= 22.18; the runner's default Node is older
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
      - run: bun run --filter @tandra/web test
      - run: bun run test:scripts

  # The suite is split across runners, and each runner runs several Playwright
  # workers. Every worker gets its own api/web servers, Mongo database and
  # OpenSearch alias (e2e/stack.ts), so tests never see each other's data.
  # fullyParallel is on, so --shard and the workers split by test, not by file.
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: lint
    # Chromium and its system libraries come with the image, so no shard runs `playwright
    # install` or `install-deps`. The tag MUST equal the @playwright/test version in
    # package.json (see e2e/README.md); scripts/ci-e2e-container.test.js checks it. The
    # host's docker socket is mounted so the steps below can start Mongo and OpenSearch
    # next to the job container.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: -v /var/run/docker.sock:/var/run/docker.sock
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      packages: read
    steps:
      # Not `services:`: those block the job until both are pulled and healthy
      # (~55s). Started in the background here, they come up while bun and the
      # web bundle install; "Wait for" below gates the tests. The image has no
      # docker CLI, so fetch the static client (curl/unzip are installed only if
      # the image lacks them; setup-bun below needs unzip). The containers join the
      # job's network and are reached by name: `localhost` is the job container.
      # The Discover specs search a small fixed library that global-setup seeds
      # into this OpenSearch.
      - name: Start Mongo and OpenSearch in the background
        run: |
          if ! command -v curl >/dev/null || ! command -v unzip >/dev/null; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip ca-certificates
          fi
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar -xz --strip-components=1 -C /usr/local/bin docker/docker
          nohup docker run -d --name mongodb --network ${{ job.container.network }} \
            -e MONGO_INITDB_ROOT_USERNAME=devuser -e MONGO_INITDB_ROOT_PASSWORD=devpassword \
            mongo:7 > /tmp/mongodb.log 2>&1 &
          nohup docker run -d --name opensearch --network ${{ job.container.network }} \
            -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true -e OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m" \
            opensearchproject/opensearch:2.19.1 > /tmp/opensearch.log 2>&1 &
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # vp (Vite+) needs Node >= 22.18; the runner's default Node is older
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Wait for Mongo and OpenSearch
        timeout-minutes: 3
        run: |
          until docker exec mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 2; done
          until curl -sf http://opensearch:9200/_cluster/health >/dev/null; do sleep 2; done
      - name: Container logs
        if: failure()
        run: |
          cat /tmp/mongodb.log /tmp/opensearch.log
          docker logs mongodb || true
          docker logs opensearch || true
      - run: bun run test:e2e --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          CONNECTION_URI: mongodb://devuser:devpassword@mongodb:27017/tandra_e2e?authSource=admin
          E2E_OPENSEARCH_URL: http://opensearch:9200
          E2E_WORKERS: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore
      # The job's network can't be removed while these are attached to it.
      - name: Remove Mongo and OpenSearch
        if: always()
        run: docker rm -f mongodb opensearch || true

  # Single check named `e2e` that passes only if every shard passed, so the
  # check name stays stable for .kanban-cli.json's checkNamesRequired.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - if: needs.e2e-shard.result != 'success'
        run: |
          echo "e2e shards: ${{ needs.e2e-shard.result }}"
          exit 1

  # Merges the shards' blob reports into one Playwright HTML report (also kept
  # as the `playwright-report` artifact, see e2e/README.md), publishes it to
  # GitHub Pages under pr-<number>/, then links it from a sticky PR comment.
  # keep_files preserves other PRs' report subdirectories on each deploy —
  # without it, actions-gh-pages wipes the branch on every push. Every PR
  # pushes to the same gh-pages branch, so deploys queue on one concurrency
  # group; two PRs finishing together otherwise reject one push.
  report:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always() && needs.e2e-shard.result != 'skipped'
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
      - id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - id: merge
        if: steps.download.outcome == 'success'
        run: bunx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: steps.merge.outcome == 'success'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: peaceiris/actions-gh-pages@v4
        if: steps.merge.outcome == 'success'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.merge.outcome == 'success'
        with:
          header: playwright-report
          message: |
            🎭 [Playwright report](https://igor-siergiej.github.io/tandra/pr-${{ github.event.pull_request.number }}/) for commit ${{ github.event.pull_request.head.sha }}

  # Blocking merge gate: dead code only. Run the analyzer directly via bunx
  # (the action hangs on a dead-code invocation). Install node_modules first:
  # without them fallow's resolution crawls (~140s in CI, same result); with
  # them analysis takes a few seconds. bunx's cold npm fetch of fallow is
  # cached in ~/.bun/install/cache keyed on the pinned version. Whole-repo (not
  # PR-scoped) so reachability resolves against the full graph; PR-scoped
  # discovery false-positives exports whose only consumer is an unchanged file.
  # The slow informational `fallow audit` was dropped; run it locally.
  fallow-deadcode:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: read
    steps:
      # Submodules checked out so the analyzer sees the same tree a developer has.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bunx-fallow-2.100.0
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
      - run: bunx fallow@2.100.0 dead-code

  # Build-only check that both production images still build, so a broken
  # Dockerfile (a COPY missing for a patchedDependencies file, say) fails the PR
  # instead of CD's build-publish after the release is cut. Same NODE_AUTH_TOKEN
  # build arg as CD; nothing is pushed or run (the web image's nginx needs an
  # `api` upstream). Not gated on lint, so it runs alongside everything else.
  # Dependabot PRs can't read Actions secrets, so they skip, like semgrep.
  # The gha cache is branch-scoped (PRs also read main's), one scope per image.
  docker-build-api:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GH_TOKEN }}
          cache-from: type=gha,scope=docker-api
          cache-to: type=gha,scope=docker-api,mode=max

  docker-build-web:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GH_TOKEN }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=docker-web
          cache-to: type=gha,scope=docker-web,mode=max

  semgrep:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          generateSarif: true
          config: >-
            p/security-audit
            p/typescript
            p/owasp-top-ten
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
